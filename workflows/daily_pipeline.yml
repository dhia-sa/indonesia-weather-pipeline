name: Daily weather pipeline

on:
  schedule:
    - cron: "17 0 * * *"   # 00:17 UTC = 07:17 WIB, every day
  workflow_dispatch:         # "Run workflow" button, also used for backfills
    inputs:
      mode:
        description: incremental or backfill
        type: choice
        options: [incremental, backfill]
        default: incremental
      start_date:
        description: Backfill start date (YYYY-MM-DD)
        default: "2020-01-01"

concurrency:
  group: weather-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_SSLMODE: require
      MODE: ${{ inputs.mode || 'incremental' }}
      START_DATE: ${{ inputs.start_date || '2020-01-01' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract & load
        run: |
          if [ "$MODE" = "backfill" ]; then
            python -m extract.pipeline backfill --start "$START_DATE"
          else
            python -m extract.pipeline incremental
          fi

      - name: dbt build (seeds, models, tests)
        working-directory: dbt
        run: dbt build --profiles-dir .

      - name: dbt source freshness
        working-directory: dbt
        run: dbt source freshness --profiles-dir .
